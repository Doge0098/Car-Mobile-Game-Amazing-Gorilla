<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Icono de Google Play (512 × 512)</title>
<!-- Fuente del icono de la ficha de Google Play. render.mjs le hace la foto al <canvas>. -->
<style>
  html, body { margin: 0; background: #1a0b3a; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="art" width="512" height="512"></canvas>
<script src="art.js"></script>
<script>
  const icon = new Image();
  icon.onload = () => {
    paintIcon(document.getElementById('art'), icon);
    document.body.dataset.ready = '1';
  };
  icon.src = '../../icons/icon-512.png';
</script>
</body>
</html>
